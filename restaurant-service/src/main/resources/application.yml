server:
  address: 0.0.0.0
  port: ${PORT:8080}
  #port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: restaurant-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      #uri: ${MONGODB_URI:mongodb://localhost:27017/restaurant}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    email: ${ADMIN_EMAIL:admin@restaurant.local}
    password: ${ADMIN_PASSWORD:admin12345}

logging:
  level:
    root: WARN
    com.tableline.restaurant: INFO
    org.springframework.web: WARN
    org.mongodb.driver: WARN
